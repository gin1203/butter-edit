<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>The Butter｜韓國選品</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#FAF8F5;color:#3D2010}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{display:none}
  .scrollbar-none{scrollbar-width:none}
</style>
</head>
<body>

<div id="app" style="max-width:600px;margin:0 auto;min-height:100vh;background:#FAF8F5;padding-bottom:90px">

  <div style="position:sticky;top:0;z-index:20;background:#FAF8F5;padding:14px 16px 10px;border-bottom:1px solid #E8D5B0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:19px;font-weight:900;color:#5C3A1E;letter-spacing:0.5px">🧈 THE BUTTER</div>
      <div style="display:flex;align-items:center;gap:4px">
        <div style="font-size:11px;color:#9C7A5A;margin-right:6px">韓國選品代購</div>
        <button id="header-member-btn" onclick="headerMemberClick()" style="background:none;border:none;cursor:pointer;padding:4px;color:#5C3A1E;position:relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button onclick="headerCartClick()" style="background:none;border:none;cursor:pointer;padding:4px;color:#5C3A1E;position:relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <div id="header-cart-badge" style="display:none;position:absolute;top:0;right:0;background:#F4845F;color:white;font-size:9px;font-weight:900;border-radius:99px;min-width:16px;height:16px;align-items:center;justify-content:center;padding:0 3px"></div>
        </button>
      </div>
    </div>
    <div id="line-banner" style="margin-bottom:10px"></div>
    <input id="search-input" type="text" placeholder="🔍 搜尋商品名稱或編號..." oninput="onSearchInput()" style="width:100%;background:white;border:1px solid #E8D5B0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:8px"/>
    <div id="cat-tabs" class="scrollbar-none" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px"></div>
  </div>

  <div id="catalog-view" style="padding:14px 16px">
    <div id="product-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"></div>
  </div>

  <div id="detail-view" style="display:none"></div>

  <div id="checkout-view" style="display:none;padding:16px"></div>

  <div id="success-view" style="display:none;padding:16px"></div>

</div>

<div id="cart-bar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:white;border-top:1px solid #E8D5B0;padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,0.06)">
  <div style="max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div>
      <div id="cart-count-text" style="font-size:11px;color:#9C7A5A;font-weight:700">已選 0 件</div>
      <div id="cart-total-text" style="font-size:18px;font-weight:900;color:#F4845F">NT$ 0</div>
    </div>
    <button id="cart-cta" onclick="goToCheckout()" style="background:#F4845F;color:white;border:none;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:900;cursor:pointer;white-space:nowrap">前往結帳</button>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 18px;border-radius:99px;background:#5C3A1E;color:white;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.25)"></div>

<script>
const FIREBASE_PROJECT="thebutter-2eb30";
const FIREBASE_API_KEY="AIzaSyAt6Te8T9DggqFmhBzZz5iEKIXlPH11DpE";
const BASE_URL=`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents`;
const WORKER_URL="https://butter-ai.kueigin.workers.dev";
const LINE_LOGIN_CHANNEL_ID="請填入你在LINE Developers Console建立的LINE Login頻道ID";

const G={
  products:[],
  loaded:false,
  search:"",
  cat:"all",
  cart:{},
  lineUser:null,
  detailProduct:null,
  detailQty:1,
  selectedSpec:{},
  form:{name:"",phone:"",lineId:"",communityName:"",address:"",sameAsBuyer:true,payment:"匯款轉帳",note:""},
};

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>{t.style.display="none";},2200);
}

function fsValueToJs(v){
  if(!v)return null;
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue,10);
  if(v.doubleValue!==undefined)return v.doubleValue;
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.arrayValue!==undefined){
    if(!v.arrayValue||!v.arrayValue.values||!v.arrayValue.values.length)return[];
    return v.arrayValue.values.map(fsValueToJs);
  }
  if(v.mapValue!==undefined){
    const o={};
    for(const[k,vv]of Object.entries(v.mapValue.fields||{}))o[k]=fsValueToJs(vv);
    return o;
  }
  return null;
}
function fsDocToObj(doc){
  const obj={id:doc.name.split("/").pop()};
  for(const[k,v]of Object.entries(doc.fields||{}))obj[k]=fsValueToJs(v);
  return obj;
}
function jsToFsValue(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="string")return{stringValue:v};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:v}:{doubleValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(jsToFsValue)}};
  if(typeof v==="object")return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,vv])=>[k,jsToFsValue(vv)]))}};
  return{stringValue:String(v)};
}
async function fsCreate(collection,id,dataObj){
  const fields={};
  for(const[k,v]of Object.entries(dataObj))fields[k]=jsToFsValue(v);
  const url=`${BASE_URL}/${collection}/${id}?key=${FIREBASE_API_KEY}`;
  const resp=await fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})});
  if(!resp.ok){
    const err=await resp.json().catch(()=>({}));
    throw new Error(err?.error?.message||"寫入資料庫失敗");
  }
  return resp.json();
}
async function fsQueryEquals(collection,field,value){
  const url=`${BASE_URL}:runQuery?key=${FIREBASE_API_KEY}`;
  const body={structuredQuery:{from:[{collectionId:collection}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:jsToFsValue(value)}},limit:20}};
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await resp.json();
  return (data||[]).filter(r=>r.document).map(r=>fsDocToObj(r.document));
}
async function fsGetDoc(collection,id){
  const resp=await fetch(`${BASE_URL}/${collection}/${id}?key=${FIREBASE_API_KEY}`);
  if(resp.status!==200)return null;
  const data=await resp.json();
  return fsDocToObj({name:id,fields:data.fields||{}});
}
async function fsListShopProducts(){
  const url=`${BASE_URL}:runQuery?key=${FIREBASE_API_KEY}`;
  const body={structuredQuery:{from:[{collectionId:"products"}],where:{fieldFilter:{field:{fieldPath:"shopVisible"},op:"EQUAL",value:{booleanValue:true}}},limit:1000}};
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await resp.json();
  const errEntry=Array.isArray(data)?data.find(r=>r.error):null;
  if(errEntry){
    throw new Error(errEntry.error.message||"讀取商品失敗，可能是 Firestore 權限規則擋住了公開讀取");
  }
  return (data||[]).filter(r=>r.document).map(r=>fsDocToObj(r.document)).filter(p=>p.archived!==true);
}

async function loadProducts(){
  try{
    G.products=await fsListShopProducts();
  }catch(e){
    console.error(e);
    showToast("商品載入失敗："+(e.message||"")+"（很可能是 Firestore 規則沒開放公開讀取）");
  }
  G.loaded=true;
  renderCatTabs();
  renderGrid();
}

function onSearchInput(){
  G.search=document.getElementById("search-input").value.trim().toLowerCase();
  renderGrid();
}

function renderCatTabs(){
  const el=document.getElementById("cat-tabs");
  const cats=[...new Set(G.products.map(p=>p.category).filter(Boolean))];
  const tabs=[["all","全部"],...cats.map(c=>[c,c])];
  el.innerHTML=tabs.map(([key,label])=>{
    const active=G.cat===key;
    return `<button onclick="setCat('${key.replace(/'/g,"\\'")}')" style="flex-shrink:0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid ${active?"#5C3A1E":"#E8D5B0"};background:${active?"#5C3A1E":"white"};color:${active?"#F5E6C8":"#9C7A5A"};cursor:pointer">${label}</button>`;
  }).join("");
}
function setCat(key){G.cat=key;renderCatTabs();renderGrid();}

function renderGrid(){
  const grid=document.getElementById("product-grid");
  if(!G.loaded){
    grid.style.display="block";
    grid.innerHTML=`<div style="grid-column:1/-1;background:white;border-radius:14px;padding:48px 20px;text-align:center;border:1px solid #E8D5B0"><div style="font-size:28px;margin-bottom:8px">⏳</div><div style="font-weight:700">商品載入中…</div></div>`;
    return;
  }
  const q=G.search;
  const filtered=G.products.filter(p=>{
    const mCat=G.cat==="all"||p.category===G.cat;
    const mQ=!q||(p.name||"").toLowerCase().includes(q)||(p.id||"").toLowerCase().includes(q);
    return mCat&&mQ;
  });
  if(!filtered.length){
    grid.style.display="block";
    grid.innerHTML=`<div style="grid-column:1/-1;background:white;border-radius:14px;padding:48px 20px;text-align:center;border:1px solid #E8D5B0"><div style="font-size:28px;margin-bottom:8px">🛒</div><div style="font-weight:700">${G.products.length===0?"目前還沒有上架商品":"找不到符合的商品"}</div></div>`;
    return;
  }
  grid.style.display="grid";
  grid.innerHTML=filtered.map(p=>{
    const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;
    const specsArr=hasSpecs?p.specs.filter(s=>s!=null&&String(s).trim()!==""):[];
    // 計算這個商品在購物車裡的總件數（可能有多個規格各自加了）
    const totalInCart=Object.entries(G.cart)
      .filter(([k])=>k===p.id||k.startsWith(p.id+"::"))
      .reduce((s,[,v])=>s+v.qty,0);
    const price=p.finalPrice||0;
    // 判斷是否全部規格都售完
    const allSoldOut=hasSpecs&&specsArr.length>0&&specsArr.every((_,i)=>{
      const st=(p.specStock||[])[i];
      const stNum=(st===null||st===undefined||st==="")?null:Number(st);
      return stNum!=null&&stNum<=0;
    });
    return `<div onclick="openDetail('${p.id}')" style="background:white;border-radius:14px;border:1px solid #E8D5B0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative">
      ${totalInCart>0?`<div style="position:absolute;top:8px;right:8px;z-index:2;background:#F4845F;color:white;font-size:10px;font-weight:900;border-radius:99px;width:20px;height:20px;display:flex;align-items:center;justify-content:center">${totalInCart}</div>`:""}
      ${allSoldOut?`<div style="position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,0.45);color:white;font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px">售完</div>`:""}
      <div style="width:100%;aspect-ratio:1/1;background:#FAF8F5;display:flex;align-items:center;justify-content:center;overflow:hidden">
        ${p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>`:`<div style="font-size:36px">${p.emoji||"📦"}</div>`}
      </div>
      <div style="padding:8px 10px 12px;display:flex;flex-direction:column;flex:1">
        <div style="font-size:10px;color:#9C7A5A;font-weight:700;margin-bottom:2px">${p.id}</div>
        <div style="font-size:12px;font-weight:700;color:#3D2010;line-height:1.35;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${p.name||""}</div>
        <div style="font-size:15px;font-weight:900;color:#F4845F;margin-top:auto">NT$ ${price.toLocaleString()}</div>
        ${hasSpecs?`<div style="font-size:10px;color:#9C7A5A;margin-top:2px">${specsArr.length} 種顏色/款式</div>`:""}
      </div>
    </div>`;
  }).join("");
}

function openDetail(pid){
  const p=G.products.find(x=>x.id===pid);
  if(!p)return;
  G.detailProduct=pid;
  G.selectedSpec=G.selectedSpec||{};
  if(G.selectedSpec[pid]==null)G.selectedSpec[pid]=0;
  G.detailQty=1;
  document.getElementById("catalog-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  document.querySelector("#app > div:first-child").style.display="none";
  renderDetail();
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById("detail-view").style.display="none";
  document.getElementById("catalog-view").style.display="block";
  document.querySelector("#app > div:first-child").style.display="block";
  G.detailProduct=null;
  renderGrid();
  renderCartBar();
  window.scrollTo(0,0);
}
function renderDetail(){
  const pid=G.detailProduct;
  const p=G.products.find(x=>x.id===pid);
  if(!p){closeDetail();return;}
  const el=document.getElementById("detail-view");
  const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;
  const specsArr=hasSpecs?p.specs.filter(s=>s!=null&&String(s).trim()!==""):[];
  const selIdx=G.selectedSpec[pid]??0;
  // 顯示圖片：優先用選中規格的 specImage，fallback 到主圖
  const specImg=(p.specImages||[])[selIdx]||"";
  const mainImg=specImg||p.photo||"";
  const stockRaw=hasSpecs?(p.specStock||[])[selIdx]:null;
  const stock=(stockRaw===null||stockRaw===undefined||stockRaw==="")?null:Number(stockRaw);
  const soldOut=stock!=null&&stock<=0;
  const price=p.finalPrice||0;
  const dqty=G.detailQty||1;

  const specBtns=hasSpecs?`
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#9C7A5A;margin-bottom:8px">選擇款式</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${specsArr.map((s,i)=>{
          const st=(p.specStock||[])[i];
          const stNum=(st===null||st===undefined||st==="")?null:Number(st);
          const isSoldOut=stNum!=null&&stNum<=0;
          const isSelected=i===selIdx;
          const specImg2=(p.specImages||[])[i]||"";
          return `<button onclick="detailSelectSpec('${pid}',${i})" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;cursor:${isSoldOut?"not-allowed":"pointer"};border:2px solid ${isSelected?"#5C3A1E":"#E8D5B0"};background:${isSelected?"#5C3A1E":isSoldOut?"#F5F5F5":"white"};color:${isSelected?"white":isSoldOut?"#BDBDBD":"#3D2010"};opacity:${isSoldOut?0.5:1}" ${isSoldOut?"disabled":""}>
            ${specImg2?`<img src="${specImg2}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0"/>`:""}<span>${s}${isSoldOut?" (售完)":stNum!=null?` (剩${stNum})`:""}</span>
          </button>`;
        }).join("")}
      </div>
    </div>`:"";

  el.innerHTML=`
    <div style="position:fixed;top:0;left:0;right:0;z-index:50;background:#FAF8F5;padding:10px 16px;border-bottom:1px solid #E8D5B0;display:flex;align-items:center;gap:10px;max-width:600px;margin:0 auto">
      <button onclick="closeDetail()" style="background:none;border:none;font-size:20px;cursor:pointer;padding:0;color:#5C3A1E;display:flex;align-items:center;gap:4px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M3 12h18"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
        <span style="font-size:13px;font-weight:700">首頁</span>
      </button>
      <div style="flex:1"></div>
      <button onclick="${G.lineUser?'logoutLine()':'lineLogin()'}" style="background:none;border:none;cursor:pointer;padding:4px;position:relative;color:#5C3A1E">
        ${G.lineUser&&G.lineUser.pictureUrl
          ?`<img src="${G.lineUser.pictureUrl}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #06C755"/>`
          :`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`}
      </button>
      <button onclick="goToCheckout()" style="background:none;border:none;cursor:pointer;padding:4px;position:relative;color:#5C3A1E">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        ${Object.values(G.cart).reduce((s,i)=>s+i.qty,0)>0?`<div style="position:absolute;top:0;right:0;background:#F4845F;color:white;font-size:9px;font-weight:900;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px">${Object.values(G.cart).reduce((s,i)=>s+i.qty,0)}</div>`:""}
      </button>
    </div>
    <div style="height:50px"></div>
    <div style="width:100%;aspect-ratio:1/1;background:#FAF8F5;overflow:hidden;position:relative" id="detail-img-wrap">
      ${mainImg?`<img id="detail-main-img" src="${mainImg}" style="width:100%;height:100%;object-fit:cover"/>`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:60px">${p.emoji||"📦"}</div>`}
    </div>
    <div style="padding:16px 16px 120px">
      <div style="font-size:10px;color:#9C7A5A;font-weight:700;margin-bottom:4px">${p.id}・${p.category||""}</div>
      <div style="font-size:18px;font-weight:900;color:#3D2010;line-height:1.3;margin-bottom:8px">${p.name||""}</div>
      <div style="font-size:22px;font-weight:900;color:#F4845F;margin-bottom:20px">NT$ ${price.toLocaleString()}</div>
      ${specBtns}
      ${!soldOut?`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <div style="font-size:12px;font-weight:700;color:#9C7A5A">數量</div>
        <div style="display:flex;align-items:center;gap:0;background:#FAF8F5;border:1px solid #E8D5B0;border-radius:10px;overflow:hidden">
          <button onclick="changeDetailQty(-1)" style="width:36px;height:36px;border:none;background:none;font-size:18px;font-weight:900;color:#5C3A1E;cursor:pointer">−</button>
          <span style="font-size:15px;font-weight:900;min-width:28px;text-align:center">${dqty}</span>
          <button onclick="changeDetailQty(1)" style="width:36px;height:36px;border:none;background:none;font-size:18px;font-weight:900;color:#5C3A1E;cursor:pointer">+</button>
        </div>
        ${stock!=null?`<div style="font-size:11px;color:#9C7A5A">剩 ${stock} 件</div>`:""}
      </div>`:""}
    </div>
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:20;background:white;border-top:1px solid #E8D5B0;padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,0.06)">
      <div style="max-width:600px;margin:0 auto">
        ${soldOut
          ?`<button disabled style="width:100%;background:#E8D5B0;color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:900;cursor:not-allowed">此款式已售完</button>`
          :`<div style="display:flex;gap:8px">
              <button onclick="detailAddToCart('${pid}',${selIdx})" style="flex:1;background:white;color:#F4845F;border:2px solid #F4845F;border-radius:12px;padding:14px;font-size:14px;font-weight:900;cursor:pointer">加入購物車</button>
              <button onclick="detailBuyNow('${pid}',${selIdx})" style="flex:1;background:#F4845F;color:white;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:900;cursor:pointer">立即購買</button>
            </div>`
        }
      </div>
    </div>`;
}
function detailBuyNow(pid,specIndex){
  detailAddToCart(pid,specIndex);
  goToCheckout();
}
function detailSelectSpec(pid,idx){
  G.selectedSpec=G.selectedSpec||{};
  G.selectedSpec[pid]=idx;

function changeDetailQty(delta){

  const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;

  const stockRaw=hasSpecs?(p.specStock||[])[selIdx]:null;

function detailAddToCart(pid,specIndex){

function cartCheckoutQty(cartKey,delta,pid,specIndex){

  const stock=(stockRaw===null||stockRaw===undefined||stockRaw==="")?null:Number(stockRaw);
  const cur=G.cart[cartKey]?.qty||0;
  let next=Math.max(0,cur+delta);
  if(stock!=null&&next>stock){showToast(`庫存只剩 ${stock} 件`);next=stock;}
  if(next===0){delete G.cart[cartKey];}
  else{G.cart[cartKey]={...G.cart[cartKey],qty:next};}

  renderCartBar();
}

// 下單成功後扣庫存：一定要先讀「當下最新」的商品資料再整份寫回去，
// 不能只送 specStock 這一個欄位，不然會把商品其他欄位（照片、規格圖片等）洗掉
async function decrementProductStock(productId,specIndex,qty){
  try{
    const fresh=await fsGetDoc("products",productId);
    if(!fresh||!Array.isArray(fresh.specStock))return;
    const stockVal=fresh.specStock[specIndex];
    if(stockVal===null||stockVal===undefined||stockVal==="")return; // 不限量，不用扣
    const newStock=[...fresh.specStock];
    newStock[specIndex]=Math.max(0,Number(stockVal)-qty);
    const merged={...fresh,specStock:newStock};
    delete merged.id;
    await fsCreate("products",productId,merged);
  }catch(e){
    console.error("扣庫存失敗（訂單本身已經成功送出，不影響客人）",e);
  }
}

async function submitOrder(){
  const f=G.form;
  if(!f.name.trim()){showCheckoutError("請填寫訂購人姓名");return;}
  if(!f.communityName.trim()){showCheckoutError("請填寫社群暱稱");return;}
  if(!f.phone.trim()){showCheckoutError("請填寫訂購人電話");return;}
  if(!f.lineId.trim()){showCheckoutError("請填寫 LINE ID");return;}
  const items=Object.values(G.cart);
  if(!items.length){showCheckoutError("購物車是空的，請先選擇商品");return;}

  const btn=document.getElementById("submit-btn");
  btn.disabled=true;btn.textContent="送出中…";
  document.getElementById("checkout-error").style.display="none";

  try{
    const phoneDigits=f.phone.replace(/\D/g,"").slice(-10)||Date.now().toString();
    let customerId="web_"+phoneDigits;

    if(G.lineUser&&G.lineUser.userId){
      customerId="line_"+G.lineUser.userId.slice(0,16);
      const existingDoc=await fsGetDoc("customers",customerId);
      if(existingDoc){
        const merged={...existingDoc};
        if(!merged.phone)merged.phone=f.phone.trim();
        if(!merged.address)merged.address=f.address.trim();
        if(!merged.communityName)merged.communityName=f.communityName.trim();
        delete merged.id;
        await fsCreate("customers",customerId,merged);
      } else {
        await fsCreate("customers",customerId,{
          communityName:f.communityName.trim(),
          lineName:G.lineUser.displayName||"",
          lineUserId:G.lineUser.userId,
          phone:f.phone.trim(),
          address:f.address.trim(),
          note:"（官網下單自動建立）",
          createdAt:Date.now(),
        });
      }
    } else {
      const existing=await fsQueryEquals("customers","phone",f.phone.trim());
      if(existing.length){
        customerId=existing[0].id;
      } else {
        await fsCreate("customers",customerId,{
          communityName:f.communityName.trim(),
          lineName:f.lineId.trim(),
          phone:f.phone.trim(),
          address:f.address.trim(),
          note:"（官網下單自動建立）",
          createdAt:Date.now(),
        });
      }
    }

    const groupTs=Date.now();
    let i=0;
    for(const item of items){
      const p=item.product;
      const orderId=`web_${groupTs}_${i}`;
      await fsCreate("orders",orderId,{
        productId:p.id,
        productName:p.name||"",
        productEmoji:p.emoji||"📦",
        spec:item.spec||"",
        customerId,
        communityName:f.communityName.trim(),
        buyerName:f.name.trim(),
        qty:item.qty,
        unitPrice:p.finalPrice||0,
        total:(p.finalPrice||0)*item.qty,
        status:"pending",
        orderType:"shop_web",
        paymentMethod:f.payment,
        address:f.address.trim(),
        phone:f.phone.trim(),
        lineId:f.lineId.trim(),
        note:f.note.trim(),
        purchased:false,
        lineUserId:(G.lineUser&&G.lineUser.userId)||"",
        createdAt:groupTs,
      });
      if(item.specIndex!=null){
        await decrementProductStock(p.id,item.specIndex,item.qty);
      }
      i++;
    }

    showSuccess(items,items.reduce((s,i2)=>s+i2.qty*(i2.product.finalPrice||0),0));
  }catch(e){
    console.error(e);
    showCheckoutError("送出訂單失敗，請檢查網路後再試一次（"+(e.message||"")+"）");
    btn.disabled=false;btn.textContent="送出訂單";
  }
}

function lineLoginRedirectUri(){
  return location.origin+location.pathname;
}
function lineLogin(){
  const state=Math.random().toString(36).slice(2)+Date.now();
  localStorage.setItem("butter_line_state",state);
  const params=new URLSearchParams({
    response_type:"code",
    client_id:LINE_LOGIN_CHANNEL_ID,
    redirect_uri:lineLoginRedirectUri(),
    state,
    scope:"profile openid",
  });
  location.href="https://access.line.me/oauth2/v2.1/authorize?"+params.toString();
}
function logoutLine(){

function restoreLineUser(){
  try{
    const raw=localStorage.getItem("butter_line_user");
    if(!raw)return;
    const u=JSON.parse(raw);
    if(u&&u.userId){
      G.lineUser=u;
      if(!G.form.name)G.form.name=u.displayName||"";
      if(!G.form.lineId)G.form.lineId=u.displayName||"";
      if(!G.form.communityName)G.form.communityName=u.displayName||"";
    }
  }catch(e){}
}
async function handleLineLoginCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get("code");
  const state=params.get("state");
  if(!code)return;
  const savedState=localStorage.getItem("butter_line_state");
  history.replaceState({},"",location.pathname);
  if(!state||state!==savedState){
    showToast("LINE登入驗證失敗，請重新登入");
    return;
  }
  try{
    const resp=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Service":"line-login-exchange"},
      body:JSON.stringify({code,redirectUri:lineLoginRedirectUri()}),
    });
    const data=await resp.json();
    if(!resp.ok||!data.userId)throw new Error(data.error||"登入失敗");
    G.lineUser=data;
    localStorage.setItem("butter_line_user",JSON.stringify(data));
    if(!G.form.name)G.form.name=data.displayName||"";
    if(!G.form.lineId)G.form.lineId=data.displayName||"";
    if(!G.form.communityName)G.form.communityName=data.displayName||"";
    showToast("LINE登入成功！");
  }catch(e){
    console.error(e);
    showToast("LINE登入失敗："+(e.message||""));
  }
  renderLineBanner();
}
function renderLineBanner(){
  const el=document.getElementById("line-banner");
  if(!el)return;
  if(G.lineUser){
    el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;background:#E8F5E9;border:1px solid #A5D6A7;border-radius:10px;padding:8px 12px">
      ${G.lineUser.pictureUrl?`<img src="${G.lineUser.pictureUrl}" style="width:28px;height:28px;border-radius:50%;object-fit:cover"/>`:`<div style="width:28px;height:28px;border-radius:50%;background:#C5A880"></div>`}
      <div style="flex:1;font-size:12px;font-weight:700;color:#2E7D32">已用 LINE 登入：${G.lineUser.displayName||""}</div>
      <button onclick="logoutLine()" style="background:none;border:none;color:#2E7D32;font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline">登出</button>
    </div>`;
  } else {
    el.innerHTML=`<button onclick="lineLogin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:#06C755;color:white;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer">💬 使用 LINE 登入，訂購資料自動幫你填好</button>`;
  }
}

async function init(){
  restoreLineUser();
  renderLineBanner();
  await handleLineLoginCallback();
  loadProducts();
}
init();
</script>
</body>
