// ── Toast ──────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>{t.style.display="none";},2400);
}

// ── Firestore helpers ──────────────────────────────
function fsVal(v){
  if(!v)return null;
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue,10);
  if(v.doubleValue!==undefined)return v.doubleValue;
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.arrayValue!==undefined){
    if(!v.arrayValue?.values?.length)return[];
    return v.arrayValue.values.map(fsVal);
  }
  if(v.mapValue!==undefined){
    const o={};
    for(const[k,vv]of Object.entries(v.mapValue.fields||{}))o[k]=fsVal(vv);
    return o;
  }
  return null;
}
function fsDoc(doc){
  const obj={id:doc.name.split("/").pop()};
  for(const[k,v]of Object.entries(doc.fields||{}))obj[k]=fsVal(v);
  return obj;
}
function jsToFs(v){
  if(typeof v==="string")return{stringValue:v};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:v}:{doubleValue:v};
  return{stringValue:String(v==null?"":v)};
}
async function fsCreate(col,id,data){
  const fields={};
  for(const[k,v]of Object.entries(data))fields[k]=jsToFs(v);
  const resp=await fetch(`${BASE_URL}/${col}/${id}?key=${FIREBASE_API_KEY}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields})
  });
  if(!resp.ok)throw new Error("寫入失敗");
  return resp.json();
}
async function fsGet(col,id){
  const resp=await fetch(`${BASE_URL}/${col}/${id}?key=${FIREBASE_API_KEY}`);
  if(resp.status!==200)return null;
  const data=await resp.json();
  return fsDoc({name:id,fields:data.fields||{}});
}
async function fsQuery(col,field,value){
  const url=`${BASE_URL}:runQuery?key=${FIREBASE_API_KEY}`;
  const body={structuredQuery:{from:[{collectionId:col}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:jsToFs(value)}},limit:20}};
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await resp.json();
  return (data||[]).filter(r=>r.document).map(r=>fsDoc(r.document));
}
async function fsListShopProducts(){
  const url=`${BASE_URL}:runQuery?key=${FIREBASE_API_KEY}`;
  const body={structuredQuery:{from:[{collectionId:"products"}],where:{fieldFilter:{field:{fieldPath:"shopVisible"},op:"EQUAL",value:{booleanValue:true}}},limit:1000}};
  const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await resp.json();
  const errEntry=Array.isArray(data)?data.find(r=>r.error):null;
  if(errEntry)throw new Error(errEntry.error?.message||"讀取商品失敗");
  return (data||[]).filter(r=>r.document).map(r=>fsDoc(r.document)).filter(p=>p.archived!==true);
}

// ── LINE Login ─────────────────────────────────────
function lineLoginRedirectUri(){return "https://gin1203.github.io/butter-edit/shop.html";}
function lineLogin(){
  const state=Math.random().toString(36).slice(2)+Date.now();
  localStorage.setItem("butter_line_state",state);
  const params=new URLSearchParams({response_type:"code",client_id:LINE_LOGIN_CHANNEL_ID,redirect_uri:lineLoginRedirectUri(),state,scope:"profile openid"});
  location.href="https://access.line.me/oauth2/v2.1/authorize?"+params.toString();
}
function logoutLine(){
  localStorage.removeItem("butter_line_user");
  G.lineUser=null;
  renderLineBanner();
  renderCartBar();
  renderGrid();
  showToast("已登出");
}
function restoreLineUser(){
  try{
    const raw=localStorage.getItem("butter_line_user");
    if(!raw)return;
    const u=JSON.parse(raw);
    if(u&&u.userId)G.lineUser=u;
  }catch(e){}
}
async function handleLineLoginCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get("code"),state=params.get("state");
  if(!code)return;
  const savedState=localStorage.getItem("butter_line_state");
  history.replaceState({},"",location.pathname);
  if(!state||state!==savedState){showToast("LINE登入驗證失敗，請重試");return;}
  try{
    const resp=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","X-Service":"line-login-exchange"},body:JSON.stringify({code,redirectUri:lineLoginRedirectUri()})});
    const data=await resp.json();
    if(!resp.ok||!data.userId)throw new Error(data.error||"登入失敗");
    G.lineUser=data;
    localStorage.setItem("butter_line_user",JSON.stringify(data));
    showToast(`歡迎，${data.displayName}！`);
    // 登入成功後，自動把這個人寫進 customers（讓後台看得到誰登入過，不需要等他送出訂單）
    try{
      const custId="line_"+data.userId.slice(0,16);
      const existing=await fsGet("customers",custId);
      if(!existing){
        await fsCreate("customers",custId,{
          communityName:"",
          lineName:data.displayName||"",
          lineUserId:data.userId,
          pictureUrl:data.pictureUrl||"",
          phone:"",
          address:"",
          note:"（商城登入自動建立）",
          shopMember:true,
          createdAt:Date.now(),
        });
      } else if(!existing.shopMember){
        // 已存在但沒有 shopMember 標記，只補這一個欄位，其他資料完全不動
        const patchUrl=`${BASE_URL}/customers/${custId}?updateMask.fieldPaths=shopMember&updateMask.fieldPaths=pictureUrl&key=${FIREBASE_API_KEY}`;
        await fetch(patchUrl,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{shopMember:{booleanValue:true},pictureUrl:{stringValue:data.pictureUrl||""}}})});
      }
    }catch(e){console.warn("建立商城會員資料失敗（不影響登入）",e);}
  }catch(e){showToast("LINE登入失敗："+(e.message||""));}
  renderLineBanner();
  renderCartBar();
}

// ── 商品載入 ───────────────────────────────────────
async function loadProducts(){
  // 先檢查賣場是否開啟
  try{
    const resp=await fetch(`${BASE_URL}/settings/shop?key=${FIREBASE_API_KEY}`);
    if(resp.ok){
      const data=await resp.json();
      const shopOpen=data.fields?.shopOpen?.booleanValue;
      if(shopOpen===false){
        showShopClosed(data.fields?.closedMessage?.stringValue||"");
        return;
      }
    }
  }catch(e){/* 讀不到就當作開啟 */}
  try{G.products=await fsListShopProducts();}
  catch(e){console.error(e);showToast("商品載入失敗："+e.message);}
  restoreCartFromStorage(); // 商品資料齊全了，才能把存起來的購物車內容對照回完整商品資訊
  G.loaded=true;
  renderCatTabs();
  renderGrid();
  renderCartBar();
}
function showShopClosed(msg){
  document.getElementById("catalog-view").innerHTML=`
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">🔒</div>
      <div style="font-size:18px;font-weight:900;color:#5C3A1E;margin-bottom:8px">賣場暫時關閉中</div>
      <div style="font-size:13px;color:#9C7A5A;line-height:1.6">${msg||"目前暫停接單，請稍後再來"}</div>
    </div>`;
}
function onSearchInput(){G.search=document.getElementById("search-input").value.trim().toLowerCase();renderGrid();}
function renderCatTabs(){
  const el=document.getElementById("cat-tabs");
  const cats=[...new Set(G.products.map(p=>p.category).filter(Boolean))];
  const tabs=[["all","全部"],...cats.map(c=>[c,c])];
  el.innerHTML=tabs.map(([key,label])=>{
    const active=G.cat===key;
    return `<button onclick="setCat('${key.replace(/'/g,"\\'")}')" style="flex-shrink:0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid ${active?"#5C3A1E":"#E8D5B0"};background:${active?"#5C3A1E":"white"};color:${active?"#F5E6C8":"#9C7A5A"};cursor:pointer">${label}</button>`;
  }).join("");
}
function setCat(key){G.cat=key;renderCatTabs();renderGrid();}

// ── 商品格子 ───────────────────────────────────────
function renderGrid(){
  const grid=document.getElementById("product-grid");
  if(!G.loaded){
    grid.style.display="block";
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:48px 0"><div style="font-size:28px">⏳</div><div style="font-weight:700;margin-top:8px">商品載入中…</div></div>`;
    return;
  }
  const q=G.search;
  const filtered=G.products.filter(p=>{
    const mCat=G.cat==="all"||p.category===G.cat;
    const mQ=!q||(p.name||"").toLowerCase().includes(q)||(p.id||"").toLowerCase().includes(q);
    return mCat&&mQ;
  });
  if(!filtered.length){
    grid.style.display="block";
    grid.innerHTML=`<div style="grid-column:1/-1;background:white;border-radius:14px;padding:48px 20px;text-align:center;border:1px solid #E8D5B0"><div style="font-size:28px">🛒</div><div style="font-weight:700;margin-top:8px">${G.products.length===0?"目前還沒有上架商品":"找不到符合的商品"}</div></div>`;
    return;
  }
  grid.style.display="grid";
  grid.innerHTML=filtered.map(p=>{
    const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;
    const specsArr=hasSpecs?p.specs.filter(s=>s!=null&&String(s).trim()!==""):[];
    const totalInCart=Object.entries(G.cart).filter(([k])=>k===p.id||k.startsWith(p.id+"::")).reduce((s,[,v])=>s+v.qty,0);
    const price=p.finalPrice||0;
    const allSoldOut=hasSpecs&&specsArr.every((_,i)=>{const st=(p.specStock||[])[i];const n=(st===null||st===undefined||st==="")?null:Number(st);return n!=null&&n<=0;});
    // 價格顯示：未登入顯示鎖頭
    const priceHtml=G.lineUser
      ?`<div style="font-size:15px;font-weight:900;color:#F4845F;margin-top:auto">NT$ ${price.toLocaleString()}</div>`
      :`<div style="font-size:13px;font-weight:700;color:#9C7A5A;margin-top:auto;display:flex;align-items:center;gap:4px">🔒 登入查看價格</div>`;
    return `<div onclick="openDetail('${p.id}')" style="background:white;border-radius:14px;border:1px solid #E8D5B0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative">
      ${totalInCart>0?`<div style="position:absolute;top:8px;right:8px;z-index:2;background:#F4845F;color:white;font-size:10px;font-weight:900;border-radius:99px;width:20px;height:20px;display:flex;align-items:center;justify-content:center">${totalInCart}</div>`:""}
      ${allSoldOut?`<div style="position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,0.45);color:white;font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px">售完</div>`:""}
      <div style="width:100%;aspect-ratio:1/1;background:#FAF8F5;overflow:hidden">
        ${p.photo?`<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover" loading="lazy"/>`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px">${p.emoji||"📦"}</div>`}
      </div>
      <div style="padding:8px 10px 12px;display:flex;flex-direction:column;flex:1">
        <div style="font-size:12px;font-weight:700;color:#3D2010;line-height:1.35;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${p.name||""}</div>
        ${priceHtml}
        ${hasSpecs?`<div style="font-size:10px;color:#9C7A5A;margin-top:2px">${specsArr.length} 種顏色/款式</div>`:""}
      </div>
    </div>`;
  }).join("");
}

// ── 詳情頁 ─────────────────────────────────────────
function openDetail(pid){
  const p=G.products.find(x=>x.id===pid);if(!p)return;
  G.detailProduct=pid;
  G.selectedSpec=G.selectedSpec||{};
  if(G.selectedSpec[pid]==null)G.selectedSpec[pid]=0;
  G.detailQty=1;
  document.getElementById("catalog-view").style.display="none";
  document.getElementById("detail-view").style.display="block";
  document.getElementById("main-header").style.display="none";
  document.getElementById("cart-bar").style.display="none"; // 詳情頁自己底部就有按鈕，蓋住浮動購物車列避免互相遮擋
  renderDetail();
  window.scrollTo(0,0);

function detailSelectSpec(pid,idx){

function changeDetailQty(delta){
  const pid=G.detailProduct;
  const p=G.products.find(x=>x.id===pid);if(!p)return;
  const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;
  const selIdx=G.selectedSpec[pid]??0;
  const stockRaw=hasSpecs?(p.specStock||[])[selIdx]:null;
  const stock=(stockRaw===null||stockRaw===undefined||stockRaw==="")?null:Number(stockRaw);
  let next=Math.max(1,(G.detailQty||1)+delta);
  if(stock!=null&&next>stock){showToast(`庫存只剩 ${stock} 件`);next=stock;}
  G.detailQty=next;
  renderDetail();
}
// ── 購物車存到瀏覽器（重新整理不會不見）───────────────────────────────
// 只存商品ID/規格/數量這些小東西，不存整個商品物件（商品圖片是 base64，存下去會太肥），
// 重新整理後等商品清單載入完成，再用商品ID去對照回完整的商品資料
function saveCartToStorage(){
  try{
    const minimal={};
    for(const[key,item]of Object.entries(G.cart)){
      minimal[key]={productId:item.product.id,specIndex:item.specIndex,spec:item.spec,qty:item.qty};
    }
    localStorage.setItem("butter_cart",JSON.stringify(minimal));
  }catch(e){/* 存不進去就算了，不要影響購物流程 */}
}
function restoreCartFromStorage(){
  try{
    const raw=localStorage.getItem("butter_cart");
    if(!raw)return;
    const minimal=JSON.parse(raw);
    const restored={};
    for(const[key,item]of Object.entries(minimal)){
      const product=G.products.find(p=>p.id===item.productId);
      if(!product)continue; // 商品可能已經下架，這種就不要恢復了
      restored[key]={qty:item.qty,product,specIndex:item.specIndex,spec:item.spec};
    }
    G.cart=restored;
  }catch(e){/* 讀不到就當作空的購物車 */}
}

function detailAddToCart(pid,specIndex){
  const p=G.products.find(x=>x.id===pid);if(!p)return;
  const hasSpecs=Array.isArray(p.specs)&&p.specs.length>0;
  const cartKey=hasSpecs?`${pid}::${specIndex}`:pid;
  const addQty=G.detailQty||1;
  const cur=G.cart[cartKey]?.qty||0;
  const stockRaw=hasSpecs?(p.specStock||[])[specIndex]:null;
  const stock=(stockRaw===null||stockRaw===undefined||stockRaw==="")?null:Number(stockRaw);
  let next=cur+addQty;
  if(stock!=null&&next>stock){showToast(`庫存只剩 ${stock} 件`);next=stock;}
  if(next<=0)return;
  G.cart[cartKey]={qty:next,product:p,specIndex:hasSpecs?specIndex:null,spec:hasSpecs?p.specs[specIndex]:""};
  G.detailQty=1;
  showToast(`已加入購物車`);
  renderDetail();renderCartBar();
}
function detailBuyNow(pid,specIndex){
  detailAddToCart(pid,specIndex);
  goToCheckout();
}

}

        <button onclick="cartRemove('${cartKey}')" style="width:26px;height:26px;border:none;background:#FDEDEC;color:#C0392B;border-radius:6px;font-size:14px;cursor:pointer;margin-left:2px">×</button>

  </div>`;
}
function cartQty(cartKey,delta){
  const entry=G.cart[cartKey];if(!entry)return;
  const next=Math.max(0,(entry.qty||0)+delta);
  if(next===0)delete G.cart[cartKey];
  else G.cart[cartKey]={...entry,qty:next};
  renderCartSummary();renderCartBar();
}
function cartRemove(cartKey){
  delete G.cart[cartKey];
  renderCartSummary();renderCartBar();
}

      delete merged.id;
      if(!merged.communityName)merged.communityName=community;
      if(!merged.phone)merged.phone=phone;
      if(!merged.lineUserId)merged.lineUserId=G.lineUser.userId;
      if(!merged.lineName)merged.lineName=G.lineUser.displayName||"";
      await fsCreate("customers",customerId,{...merged,communityName:community,phone,createdAt:merged.createdAt||Date.now()});
    } else {
      customerId="web_"+Date.now();
      await fsCreate("customers",customerId,{communityName:community,lineName:name,phone,note:"（商城下單）",createdAt:Date.now()});
    }

    // 寫訂單
    const groupTs=Date.now();
    const orderIds=[];
    for(let i=0;i<items.length;i++){
      const item=items[i];
      const p=item.product;
      const orderId=`web_${groupTs}_${i}`;
      orderIds.push(orderId);
      await fsCreate("orders",orderId,{
        productId:p.id,productName:p.name||"",productEmoji:p.emoji||"📦",
        customerId,communityName:community,buyerName:name,
        selectedSpec:item.spec||"",
        qty:item.qty,unitPrice:p.finalPrice||0,total:(p.finalPrice||0)*item.qty,
        status:"pending",orderType:"shop_web",
        phone,lineUserId:G.lineUser?.userId||"",
        note,purchased:false,createdAt:groupTs,
      });
    }

    showSuccess(items,items.reduce((s,i)=>s+i.qty*(i.product.finalPrice||0),0),community);
  }catch(e){
    console.error(e);
    showCheckoutError("送出失敗："+(e.message||"請檢查網路後再試"));
    btn.disabled=false;btn.textContent="送出詢問單";
  }
}

// 複製到剪貼簿：優先用新版 Clipboard API，失敗的話（有些手機瀏覽器/App內建瀏覽器不支援）
// 用舊式的 execCommand 當備案，盡量確保複製這件事真的成功
function copyToClipboard(text){
  return new Promise((resolve)=>{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>{
        resolve(fallbackCopy(text));
      });
    } else {
      resolve(fallbackCopy(text));
    }
  });
}
function fallbackCopy(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.left="-9999px";
    ta.style.top="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}
